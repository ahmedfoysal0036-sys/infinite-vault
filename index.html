<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civilization Core | Backup Dashboard</title>
    <!-- JSZip for creating zip archive -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.3s, color 0.3s; }
        
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .container { width: 100%; max-width: 480px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: var(--shadow); position: relative; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { font-size: 18px; font-weight: 700; }
        
        .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; }
        .theme-toggle:hover { background: var(--border); }

        .login-screen { text-align: center; }
        .dashboard-screen { display: none; }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
        
        .input-field { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
        .input-field:focus { border-color: var(--primary); }

        .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 10px; }
        .btn-outline:hover { background: var(--border); }

        .file-drop-area { border: 2px dashed var(--border); border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 16px; cursor: pointer; position: relative; }
        .file-drop-area:hover { border-color: var(--primary); }
        .file-drop-area input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .status-box { margin-top: 16px; font-size: 13px; color: var(--text-muted); text-align: center; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 420px; border-radius: 16px; padding: 24px; border: 1px solid var(--border); max-height: 80vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-body { overflow-y: auto; flex: 1; font-size: 12px; }
        .history-item { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        
        .error-text { color: var(--danger); font-size: 12px; margin-top: 6px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="app-title">Civilization Core</h1>
            <button class="theme-toggle" onclick="App.toggleTheme()">🌙 Theme</button>
        </div>

        <!-- Login Section -->
        <div id="login-screen" class="login-screen">
            <div class="form-group">
                <label>ACCESS KEY</label>
                <input type="password" id="boot-pass" class="input-field" placeholder="Enter security pin">
            </div>
            <div id="login-error" class="error-text"></div>
            <button class="btn" onclick="App.boot()">Authenticate</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-screen" class="dashboard-screen">
            <div class="file-drop-area">
                <p id="file-label">📁 Click or Drop Folder/Files Here</p>
                <input type="file" id="files" multiple webkitdirectory directory onchange="App.handleFileSelect()">
            </div>

            <div id="status-text" class="status-box">No folder selected</div>

            <button id="up-btn" class="btn" onclick="App.uploadZip()" disabled>Compress & Upload ZIP</button>
            <button class="btn btn-outline" onclick="App.toggleHistory(true)">View Sync History</button>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Sync Archives</h3>
                <button class="theme-toggle" onclick="App.toggleHistory(false)">✕</button>
            </div>
            <div class="modal-body" id="history-list">
                <p style="text-align: center; color: var(--text-muted);">No records found.</p>
            </div>
        </div>
    </div>

    <script>
        const App = {
            T: '8582534427:AAHq4TfwFqBIy1wU9mp6bDNQGSeSD49yX94',
            C: '682844989',
            P: '787898',
            selectedFiles: [],

            toggleTheme() {
                const html = document.documentElement;
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
            },

            boot() {
                const pass = document.getElementById('boot-pass').value;
                if(pass === this.P) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard-screen').style.display = 'block';
                } else {
                    document.getElementById('login-error').innerText = 'Invalid Access Key!';
                }
            },

            handleFileSelect() {
                const files = document.getElementById('files').files;
                if(files.length > 0) {
                    this.selectedFiles = files;
                    document.getElementById('file-label').innerText = `${files.length} files selected`;
                    document.getElementById('status-text').innerText = 'Ready to bundle & sync.';
                    document.getElementById('up-btn').disabled = false;
                }
            },

            async uploadZip() {
                if(this.selectedFiles.length === 0) return;

                const btn = document.getElementById('up-btn');
                const status = document.getElementById('status-text');
                btn.disabled = true;
                status.innerText = 'Compressing files into ZIP...';

                try {
                    const zip = new JSZip();
                    for(let i = 0; i < this.selectedFiles.length; i++) {
                        const file = this.selectedFiles[i];
                        const path = file.webkitRelativePath || file.name;
                        zip.file(path, file);
                    }

                    const zipBlob = await zip.generateAsync({type:"blob"}, metadata => {
                        status.innerText = `Compressing: ${metadata.percent.toFixed(0)}%`;
                    });

                    status.innerText = 'Uploading ZIP to Telegram...';
                    const formData = new FormData();
                    formData.append('chat_id', this.C);
                    
                    const folderName = this.selectedFiles[0].webkitRelativePath.split('/')[0] || 'backup_folder';
                    const zipFile = new File([zipBlob], `${folderName}_${Date.now()}.zip`, { type: 'application/zip' });
                    
                    formData.append('document', zipFile);

                    const response = await fetch(`https://api.telegram.org/bot${this.T}/sendDocument`, {
                        method: 'POST',
                        body: formData
                    });

                    if(response.ok) {
                        status.innerText = 'Upload Successful!';
                        this.saveHistory(zipFile.name, zipFile.size);
                    } else {
                        status.innerText = 'Upload Failed. Check Telegram limits.';
                    }
                } catch(err) {
                    console.error(err);
                    status.innerText = 'Error during compression/upload.';
                }
                btn.disabled = false;
            },

            saveHistory(name, size) {
                let history = JSON.parse(localStorage.getItem('vault_sync_history') || '[]');
                history.push({ name, size, time: new Date().toISOString() });
                localStorage.setItem('vault_sync_history', JSON.stringify(history));
            },

            toggleHistory(show) {
                const modal = document.getElementById('history-modal');
                if(show) {
                    const list = document.getElementById('history-list');
                    let history = JSON.parse(localStorage.getItem('vault_sync_history') || '[]');
                    
                    if(history.length === 0) {
                        list.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No records found.</p>`;
                    } else {
                        list.innerHTML = '';
                        history.reverse().forEach(item => {
                            const dateStr = new Date(item.time).toLocaleString();
                            const sizeMB = (item.size / (1024*1024)).toFixed(2);
                            list.innerHTML += `
                                <div class="history-item">
                                    <div><b>📦 ${item.name}</b><br><span style="color:var(--text-muted);">${sizeMB} MB</span></div>
                                    <div style="text-align: right; color:var(--text-muted);">${dateStr}</div>
                                </div>
                            `;
                        });
                    }
                    modal.style.display = 'flex';
                } else {
                    modal.style.display = 'none';
                }
            }
        };
    </script>
</body>
</html>
