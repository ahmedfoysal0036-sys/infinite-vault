<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civilization Core | Backup Dashboard</title>
    <!-- JSZip for creating zip archive -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --terminal-bg: #030712;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --terminal-bg: #0f172a;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.3s, color 0.3s; }
        
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .main-layout { display: flex; gap: 20px; width: 100%; max-width: 900px; flex-wrap: wrap; justify-content: center; }

        .container { width: 100%; max-width: 440px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
        
        .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .theme-toggle:hover { background: var(--border); }

        .login-screen { text-align: center; padding: 20px 0; }
        .dashboard-screen { display: none; }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); letter-spacing: 1px; }
        
        .input-field { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; }
        .input-field:focus { border-color: var(--primary); }

        .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 8px; }
        .btn-outline:hover { background: var(--border); }

        .file-drop-area { border: 2px dashed var(--border); border-radius: 14px; padding: 16px; text-align: center; margin-bottom: 12px; cursor: pointer; position: relative; background: var(--bg); }
        .file-drop-area:hover { border-color: var(--primary); }
        .file-drop-area input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .selected-list { max-height: 100px; overflow-y: auto; font-size: 11px; color: var(--text-muted); margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: left; background: var(--bg); }

        .terminal-box { width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); display: none; flex-direction: column; }
        .terminal-header { font-size: 12px; font-weight: 600; margin-bottom: 10px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .terminal-screen { background: var(--terminal-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; height: 320px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--success); display: flex; flex-direction: column; gap: 4px; }
        .terminal-screen .err { color: var(--danger); }
        .terminal-screen .info { color: var(--text-muted); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 420px; border-radius: 16px; padding: 20px; border: 1px solid var(--border); max-height: 80vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-body { overflow-y: auto; flex: 1; font-size: 11px; }
        .history-item { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        
        .error-text { color: var(--danger); font-size: 12px; margin-top: 6px; text-align: center; }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- Control Panel -->
        <div class="container">
            <div class="header">
                <h1 id="app-title">Civilization Core</h1>
                <button class="theme-toggle" onclick="App.toggleTheme()">🌓 Theme</button>
            </div>

            <!-- Login Section -->
            <div id="login-screen" class="login-screen">
                <div class="form-group">
                    <label>ACCESS KEY</label>
                    <input type="password" id="boot-pass" class="input-field" placeholder="Enter security pin">
                </div>
                <div id="login-error" class="error-text"></div>
                <button class="btn" onclick="App.boot()">Authenticate</button>
            </div>

            <!-- Dashboard Section -->
            <div id="dashboard-screen" class="dashboard-screen">
                <div class="file-drop-area" id="drop-zone">
                    <p id="file-label" style="font-size: 12px; font-weight: 500;">📁 Add Multiple Folders / Files</p>
                    <input type="file" id="files" multiple webkitdirectory directory>
                </div>

                <div class="selected-list" id="selected-list">
                    <i>No folders/files added yet. Select one by one to queue.</i>
                </div>

                <button id="up-btn" class="btn" onclick="App.startZipUpload()" disabled>Bundle, Split & Upload ZIP</button>
                <button class="btn btn-outline" onclick="App.toggleHistory(true)">View Sync Archives</button>
            </div>
        </div>

        <!-- Live Monitoring Terminal -->
        <div class="terminal-box" id="terminal-box">
            <div class="terminal-header">
                <span>LIVE TRANSMISSION LOGS</span>
                <span style="width: 8px; height: 8px; background: var(--success); border-radius: 50%; display: inline-block;"></span>
            </div>
            <div class="terminal-screen" id="terminal-screen">
                <div class="info">> System standby. Ready for payload...</div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 13px; font-weight: 600;">Sync Archives</h3>
                <button class="theme-toggle" onclick="App.toggleHistory(false)">✕</button>
            </div>
            <div class="modal-body" id="history-list">
                <p style="text-align: center; color: var(--text-muted);">No records found.</p>
            </div>
        </div>
    </div>

    <script>
        const App = {
            T: '8582534427:AAHq4TfwFqBIy1wU9mp6bDNQGSeSD49yX94',
            C: '682844989',
            P: '787898',
            collectedFiles: [],

            toggleTheme() {
                const html = document.documentElement;
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', newTheme);
            },

            log(msg, type='success') {
                const term = document.getElementById('terminal-screen');
                const time = new Date().toLocaleTimeString();
                const cls = type === 'err' ? 'err' : (type === 'info' ? 'info' : '');
                term.innerHTML += `<div class="${cls}">[${time}] ${msg}</div>`;
                term.scrollTop = term.scrollHeight;
            },

            boot() {
                const pass = document.getElementById('boot-pass').value;
                if(pass === this.P) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard-screen').style.display = 'block';
                    document.getElementById('terminal-box').style.display = 'flex';
                    this.log("Authentication successful. Core online.");
                } else {
                    document.getElementById('login-error').innerText = 'Invalid Access Key!';
                }
            },

            initFileListeners() {
                const fileInput = document.getElementById('files');
                
                fileInput.addEventListener('change', (e) => {
                    const files = e.target.files;
                    if(files.length > 0) {
                        let addedCount = 0;
                        for(let i=0; i<files.length; i++) {
                            const f = files[i];
                            const path = f.webkitRelativePath || f.name;
                            if(!this.collectedFiles.some(item => item.path === path)) {
                                this.collectedFiles.push({ file: f, path: path });
                                addedCount++;
                            }
                        }
                        this.updateSelectedListUI();
                        document.getElementById('up-btn').disabled = false;
                        this.log(`Added ${addedCount} items. Total queued: ${this.collectedFiles.length}`);
                        fileInput.value = '';
                    }
                });
            },

            updateSelectedListUI() {
                const listDiv = document.getElementById('selected-list');
                if(this.collectedFiles.length === 0) {
                    listDiv.innerHTML = `<i>No folders/files added yet. Select one by one to queue.</i>`;
                    return;
                }
                
                let folders = new Set();
                this.collectedFiles.forEach(item => {
                    const topFolder = item.path.split('/')[0];
                    if(topFolder) folders.add(topFolder);
                });

                listDiv.innerHTML = `<b>Queued Sources (${folders.size} folders / ${this.collectedFiles.length} files):</b><br>` + 
                    Array.from(folders).map(f => `📁 ${f}`).join('<br>');
            },

            async startZipUpload() {
                if(this.collectedFiles.length === 0) return;

                const btn = document.getElementById('up-btn');
                btn.disabled = true;
                this.log("Initializing ZIP compression for selected items...", "info");

                try {
                    const zip = new JSZip();
                    this.collectedFiles.forEach(item => {
                        zip.file(item.path, item.file);
                    });

                    const zipBlob = await zip.generateAsync({type:"blob"});
                    const totalSizeMB = zipBlob.size / (1024 * 1024);
                    this.log(`ZIP created. Total Size: ${totalSizeMB.toFixed(2)} MB`, "info");

                    // Split into chunks if size > 40MB
                    const CHUNK_SIZE = 40 * 1024 * 1024; // 40MB per part safely under Telegram's limit
                    let chunks = [];
                    
                    if(zipBlob.size > CHUNK_SIZE) {
                        this.log(`File is large. Auto-splitting into ~40MB parts...`, "info");
                        let start = 0;
                        while(start < zipBlob.size) {
                            let end = Math.min(start + CHUNK_SIZE, zipBlob.size);
                            chunks.push(zipBlob.slice(start, end));
                            start = end;
                        }
                        this.log(`Split complete. Total parts: ${chunks.length}`, "info");
                    } else {
                        chunks.push(zipBlob);
                    }

                    let batchId = Date.now();
                    let allSuccess = true;

                    // Upload each chunk sequentially with auto-retry & delay
                    for(let i = 0; i < chunks.length; i++) {
                        let chunkBlob = chunks[i];
                        let partName = chunks.length > 1 ? `Master_Backup_${batchId}_part${i+1}_of_${chunks.length}.zip` : `Master_Backup_${batchId}.zip`;
                        let chunkFile = new File([chunkBlob], partName, { type: 'application/zip' });
                        
                        this.log(`Uploading ${partName} (${(chunkFile.size / (1024*1024)).toFixed(2)} MB)...`, "info");

                        let maxRetries = 3;
                        let attempt = 0;
                        let partSuccess = false;

                        while(attempt < maxRetries && !partSuccess) {
                            attempt++;
                            if(attempt > 1) {
                                this.log(`Retry attempt ${attempt} for ${partName} after 3s delay...`, "info");
                                await new Promise(r => setTimeout(r, 3000));
                            }

                            try {
                                await new Promise((resolve, reject) => {
                                    const formData = new FormData();
                                    formData.append('chat_id', this.C);
                                    formData.append('document', chunkFile);

                                    const xhr = new XMLHttpRequest();
                                    xhr.upload.onprogress = (e) => {
                                        if(e.lengthComputable) {
                                            const percent = ((e.loaded / e.total) * 100).toFixed(0);
                                            if(percent % 50 === 0) {
                                                this.log(`${partName} progress: ${percent}%`, "info");
                                            }
                                        }
                                    };

                                    xhr.onreadystatechange = () => {
                                        if(xhr.readyState === 4) {
                                            if(xhr.status === 200) {
                                                partSuccess = true;
                                                resolve();
                                            } else {
                                                reject(`Status: ${xhr.status}`);
                                            }
                                        }
                                    };

                                    xhr.onerror = () => reject("Network error / connection dropped");
                                    xhr.open('POST', `https://api.telegram.org/bot${this.T}/sendDocument`, true);
                                    xhr.send(formData);
                                });
                            } catch (err) {
                                this.log(`Attempt ${attempt} failed for ${partName}: ${err}`, "err");
                            }
                        }

                        if(!partSuccess) {
                            allSuccess = false;
                            this.log(`Failed to upload ${partName} after retries.`, "err");
                            break;
                        } else {
                            this.log(`Successfully delivered: ${partName}`);
                            this.saveHistory(partName, chunkFile.size);
                        }
                    }

                    if(allSuccess) {
                        this.log("All parts transmitted successfully! Backup completed.");
                        this.collectedFiles = [];
                        this.updateSelectedListUI();
                    } else {
                        this.log("Transmission interrupted. Some parts failed to upload.", "err");
                    }

                } catch(err) {
                    console.error(err);
                    this.log("Error during ZIP generation or splitting.", "err");
                }
                btn.disabled = false;
            },

            saveHistory(name, size) {
                let history = JSON.parse(localStorage.getItem('vault_sync_history') || '[]');
                history.push({ name, size, time: new Date().toISOString() });
                localStorage.setItem('vault_sync_history', JSON.stringify(history));
            },

            toggleHistory(show) {
                const modal = document.getElementById('history-modal');
                if(show) {
                    const list = document.getElementById('history-list');
                    let history = JSON.parse(localStorage.getItem('vault_sync_history') || '[]');
                    
                    if(history.length === 0) {
                        list.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No records found.</p>`;
                    } else {
                        list.innerHTML = '';
                        history.reverse().forEach(item => {
                            const dateStr = new Date(item.time).toLocaleString();
                            const sizeMB = (item.size / (1024*1024)).toFixed(2);
                            list.innerHTML += `
                                <div class="history-item">
                                    <div><b>📦 ${item.name}</b><br><span style="color:var(--text-muted);">${sizeMB} MB</span></div>
                                    <div style="text-align: right; color:var(--text-muted);">${dateStr}</div>
                                </div>
                            `;
                        });
                    }
                    modal.style.display = 'flex';
                } else {
                    modal.style.display = 'none';
                }
            }
        };

        window.onload = () => App.initFileListeners();
    </script>
</body>
</html>
